name: Build Production Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Pokidex Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Environment Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Verification Unit Tests
        run: flutter test test/unit_test.dart test/widget_test.dart

      - name: Build Production Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokidex-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Production GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "Pokidex v1.1.0 - Production Neural Telemetry Platform"
          body: |
            ## Pokidex v1.1.0 Production Release

            Production-ready APK with 250 Hz neural signal streaming over Bluetooth Low Energy (BLE) and Wi-Fi WebSockets for cognitive load analysis in NeuroSim.

            ### Features & Hardening:
            - **250 Hz Continuous Streaming**: Compact binary telemetry and JSON chunking over BLE & WebSockets.
            - **Android 14+ Foreground Service**: Persistent biopotential transmission with `connectedDevice` service type and wake-locks.
            - **Two-Way Remote Control**: Remote laptop commands alter patient presets and sampling parameters on the fly.
            - **Researcher Authentication & Terms**: Institutional login, researcher credentials, and safety protocol agreements.
            - **Zero-Drop Architecture**: Thread-safe GATT notifications and cleartext WebSocket support.

            ### Installation:
            Download `app-release.apk` below and install on your Android device (API 21+).
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
